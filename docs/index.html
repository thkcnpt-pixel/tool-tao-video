<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiện AI Thực Chiến — AI Short Video Automation</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 780px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #0f172a; background: #f8fafc; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 4px 16px rgba(15,23,42,0.05); }
    h1 { margin-top: 0; color: #1e293b; }
    .links a { display: inline-block; margin-right: 16px; color: #2563eb; font-weight: 600; text-decoration: none; }
    .code { background: #0f172a; color: #38bdf8; padding: 12px 16px; border-radius: 10px; font-family: monospace; word-break: break-all; display: none; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thiện AI Thực Chiến</h1>
    <p>Automated short-form educational AI &amp; productivity video publishing platform for creator <strong>@thiennguyen_ai</strong>.</p>
    <div id="oauth-box" class="code"></div>
    <p class="links">
      <a href="./terms.html">Terms of Service</a>
      <a href="./privacy.html">Privacy Policy</a>
    </p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("code")) {
      const box = document.getElementById("oauth-box");
      box.style.display = "block";
      box.textContent = "TikTok OAuth Authorization Code: " + params.get("code");
    }
  </script>
</body>
</html>
