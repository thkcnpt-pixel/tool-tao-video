<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root">
  <div id="topbar"><div id="prog"></div></div>
  <div id="badge"></div>
  <div id="seg-idx"></div>
  <div id="stage"></div>
  <div id="flash"></div>
  <div id="sub"></div>
  <div id="watermark">Thiện AI Thực Chiến • @thiennguyen.ai</div>
  <svg id="laser-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fde047" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#38bdf8" stop-opacity="0.15"/>
      </linearGradient>
    </defs>
    <line id="laser-line" x1="0" y1="0" x2="0" y2="0" stroke="url(#laserGrad)" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round" opacity="0"/>
    <circle id="laser-dot" cx="0" cy="0" r="7" fill="#fde047" opacity="0"/>
  </svg>
  <svg id="robot" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    </defs>
    <ellipse id="jet" cx="72" cy="150" rx="26" ry="9" fill="url(#glow)"/>
    <line x1="72" y1="18" x2="72" y2="34" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <circle id="ant" cx="72" cy="14" r="7" fill="#38bdf8"/><circle cx="72" cy="14" r="12" fill="url(#glow)"/>
    <rect x="48" y="104" width="50" height="38" rx="19" fill="url(#body)"/>
    <g id="arm"><path d="M52 118 Q30 114 12 104" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="10" cy="103" r="7" fill="#fde047"/></g>
    <path d="M96 118 Q108 124 112 134" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="24" y="30" width="96" height="78" rx="34" fill="url(#body)"/>
    <rect x="34" y="42" width="76" height="54" rx="24" fill="#0b1224"/>
    <ellipse cx="46" cy="82" rx="7" ry="4.5" fill="#fb7185" opacity=".55"/><ellipse cx="98" cy="82" rx="7" ry="4.5" fill="#fb7185" opacity=".55"/>
    <g id="eyes" fill="#67e8f9" stroke="#67e8f9" stroke-linecap="round" stroke-linejoin="round"></g>
  </svg>
</div>
<script>
const FPS = 30, FLY = 0.7, ROBOT_MAX_X = 764;
let T = null, segEls = [], wps = [];

const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = (u) => 1 - Math.pow(1 - u, 3);
const rise = (t, at, d = 0.35) => clamp((t - at) / d);

/* Gắn Emoji thông minh vào từ khóa đang phát âm trong Phụ đề Karaoke */
const EMOJI_MAP = [
  [/^(ai|gemini|chatgpt|bot|robot)$/i, '🤖'],
  [/^(nhanh|giây|tốc|x10|10x)$/i, '⚡'],
  [/^(tiền|phí|free|miễn)$/i, '💰'],
  [/^(pro|vip|nâng|mạnh)$/i, '🚀'],
  [/^(pdf|tài|file|trang|sách|excel)$/i, '📄'],
  [/^(lỗi|sai|đừng|cảnh)$/i, '⚠️'],
  [/^(bước|mẹo|bí|chuẩn|đúng)$/i, '✅'],
  [/^(lưu|save|copy|nhớ)$/i, '📌'],
  [/^(code|lập|web|cloud)$/i, '💻'],
  [/\d+%/, '📈'],
];
function wordEmoji(w) {
  const clean = String(w || '').replace(/[.,?!:;""''()]/g, '');
  for (const [re, em] of EMOJI_MAP) if (re.test(clean)) return ' ' + em;
  return '';
}

function formatCounter(raw, progress) {
  const s = String(raw ?? '');
  const m = s.match(/^([+-]?\d+(?:[.,]\d+)?)(.*)$/);
  if (!m || progress >= 1) return s;
  const num = parseFloat(m[1].replace(',', '.'));
  const cur = Math.round(num * easeOut(clamp(progress)));
  return cur + m[2];
}

const EYES = {
  amazed: '<circle cx="56" cy="68" r="11" stroke-width="0"/><circle cx="88" cy="68" r="11" stroke-width="0"/><circle cx="59" cy="65" r="3.5" fill="#0b1224" stroke-width="0"/><circle cx="91" cy="65" r="3.5" fill="#0b1224" stroke-width="0"/>',
  curious: '<ellipse cx="56" cy="68" rx="8" ry="10" stroke-width="0"/><ellipse cx="88" cy="68" rx="8" ry="10" stroke-width="0"/><circle cx="52" cy="66" r="3" fill="#0b1224" stroke-width="0"/><circle cx="84" cy="66" r="3" fill="#0b1224" stroke-width="0"/>',
  happy: '<path d="M46 72 Q56 58 66 72" fill="none" stroke-width="6"/><path d="M78 72 Q88 58 98 72" fill="none" stroke-width="6"/>',
  wink: '<path d="M46 72 Q56 58 66 72" fill="none" stroke-width="6"/><ellipse cx="88" cy="68" rx="9" ry="10" stroke-width="0"/>',
  excited: '<path d="M46 73 L56 58 L66 73" fill="none" stroke-width="6" stroke="#fde047"/><path d="M78 73 L88 58 L98 73" fill="none" stroke-width="6" stroke="#fde047"/>',
  blink: '<path d="M47 70 L65 70" fill="none" stroke-width="6"/><path d="M79 70 L97 70" fill="none" stroke-width="6"/>',
};
let curExpr = '';
function setExpr(e) { if (e !== curExpr) { document.getElementById('eyes').innerHTML = EYES[e] || EYES.happy; curExpr = e; } }

function buildHookMockup(ctxText) {
  const s = String(ctxText || '').toLowerCase();
  let cls = 'ai', icon = '✦ Gemini • GPT-4o', st = '⚡ Xử lý 10 giây', bad = 'Làm tay 2 giờ', good = '✓ Tự động x10';
  if (/excel|sheet|bảng|công thức|csv|dòng|cột/.test(s)) {
    cls = 'excel'; icon = '📊 Excel • Google Sheets'; st = 'fx Auto-Fix'; bad = '#REF! #VALUE!'; good = '✓ Chuẩn 100%';
  } else if (/pdf|word|tài liệu|hợp đồng|báo cáo|trang|sách|slide/.test(s)) {
    cls = 'pdf'; icon = '📄 AI Document Scanner'; st = '⚡ Đọc siêu tốc'; bad = 'Đọc 100 trang'; good = '✓ Tóm tắt 15s';
  } else if (/email|gmail|thư|họp|biên bản|lịch/.test(s)) {
    cls = 'mail'; icon = '✉️ Smart Workspace AI'; st = '⚡ Soạn tự động'; bad = 'Gõ tay 30 phút'; good = '✓ Xong 1 chạm';
  } else if (/code|lập trình|python|web|script|tự động|tool/.test(s)) {
    cls = 'code'; icon = '💻 AI Automation Flow'; st = '▶ Đang chạy'; bad = 'Lặp lại nhàm chán'; good = '✓ 0 lỗi • 15s';
  }
  return $(`<div class="app-mock"><div class="app-mock-top"><span class="app-pill ${cls}">${icon}</span><span class="app-status">${st}</span></div><div class="app-mock-body"><span class="bad-tag">${bad}</span><span>➔</span><span class="good-tag">${good}</span></div></div>`);
}

function build(seg, idx) {
  const el = $('<div class="seg"></div>');
  el.dataset.type = seg.type;
  const d = seg.data, wp = [];
  const R = [];
  const add = (node, at) => { node.classList.add('reveal'); el.appendChild(node); R.push([node, at]); return node; };
  seg.R = R; seg.wp = wp;
  if (seg.type === 'hook') {
    const ctx = `${T.topic || ''} ${T.badge || ''} ${(d.headline || []).join(' ')} ${d.voiceover || ''}`;
    add(buildHookMockup(ctx), 0.0);
    d.headline.forEach((line, i) => {
      const last = i === d.headline.length - 1;
      const n = add($(`<div class="hl-line ${last ? 'last' : ''}"><span>${esc(line)}</span></div>`), i * 0.09);
      if (last) seg.anchor = n.firstChild;
    });
    wp.push({ frac: 0.15, get: () => seg.anchor, expr: 'amazed' });
  } else if (seg.type === 'chat_demo') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    const u = add($(`<div class="glass"><div class="label">Yêu cầu của bạn</div><div class="text"><span class="typed"></span><i class="caret"></i></div></div>`), 0.08);
    const a = add($(`<div class="glass ai-card"><div class="label">Phản hồi tự động</div><div class="text">${esc(d.ai_reply)}</div></div>`), 0.55);
    seg.typed = u.querySelector('.typed'); seg.caret = u.querySelector('.caret');
    wp.push({ frac: 0.08, get: () => u, expr: 'curious' }, { frac: 0.55, get: () => a, expr: 'happy' });
  } else if (seg.type === 'prompt_card') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    const box = add($(`<div class="term-box"><div class="term-bar"><div class="term-dots"><i></i><i></i><i></i></div><div class="copy-pill">📋 Giữ màn hình lưu Prompt</div></div><div class="term-body">“${esc(d.prompt_text)}”</div></div>`), 0.08);
    const tip = add($(`<div class="term-tip">✨ Kết quả: ${esc(d.result_note || 'Chuẩn xác & tiết kiệm 10x thời gian')}</div>`), 0.52);
    wp.push({ frac: 0.08, get: () => box, expr: 'curious' }, { frac: 0.52, get: () => tip, expr: 'excited' });
  } else if (seg.type === 'myth_vs_fact') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    const m = add($(`<div class="myth-card"><div class="label">❌ Sai lầm phổ biến</div><div class="text">${esc(d.myth)}</div></div>`), 0.08);
    const f = add($(`<div class="fact-card"><div class="label">✅ Cách làm thông minh</div><div class="text">${esc(d.fact)}</div></div>`), 0.48);
    wp.push({ frac: 0.08, get: () => m, expr: 'amazed' }, { frac: 0.48, get: () => f, expr: 'happy' });
  } else if (seg.type === 'checklist_card') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    seg.chk = [];
    const items = d.items || [];
    const n = items.length || 1;
    items.forEach((it, i) => {
      const c = add($(`<div class="chk-item"><div class="chk-box">✓</div><div class="chk-txt">${esc(it)}</div></div>`), 0.06 + i * 0.08);
      const start = 0.12 + i * (0.78 / n);
      seg.chk.push({ el: c, start });
      wp.push({ frac: start, get: () => c, expr: i === n - 1 ? 'excited' : 'happy' });
    });
  } else if (seg.type === 'ranking_card') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    seg.rk = [];
    const items = d.ranks || []; // thứ tự truyền vào: hạng 3 -> hạng 2 -> hạng 1
    const n = items.length || 1;
    const medals = ['🥉 #3', '🥈 #2', '🥇 #1'];
    items.forEach((it, i) => {
      const isTop1 = i === n - 1;
      const label = medals[Math.max(0, 3 - n + i)] || `#${n - i}`;
      const c = add($(`<div class="rank-item ${isTop1 ? 'top1' : ''}"><div class="rank-badge">${label}</div><div class="rank-txt">${esc(it)}</div></div>`), 0.08 + i * 0.12);
      const start = 0.14 + i * (0.78 / n);
      seg.rk.push({ el: c, start, end: start + 0.78 / n, isTop1 });
      wp.push({ frac: start, get: () => c, expr: isTop1 ? 'excited' : 'curious' });
    });
  } else if (seg.type === 'comparison') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    add($(`<div class="cmp-head"><div>${esc(d.left_title)}</div><div>${esc(d.right_title)}</div></div>`), 0.06);
    seg.rows = [];
    const n = Math.min(d.left_items.length, d.right_items.length);
    for (let i = 0; i < n; i++) {
      const r = add($(`<div class="cmp-row"><div>${esc(d.left_items[i])}</div><div>${esc(d.right_items[i])}</div></div>`), 0.12 + i * 0.1);
      seg.rows.push({ el: r, start: 0.2 + i * (0.75 / n), end: 0.2 + (i + 1) * (0.75 / n) });
      wp.push({ frac: 0.2 + i * (0.75 / n), get: () => r.lastChild, expr: 'happy' });
    }
  } else if (seg.type === 'stat_card') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    const m = add($(`<div class="metric-wrap glass"><div class="metric">${esc(d.metric)}</div><div class="text">${esc(d.summary)}</div></div>`), 0.06);
    seg.metricEl = m.querySelector('.metric'); seg.metricRaw = d.metric;
    seg.bl = [];
    (d.bullets || []).forEach((b, i) => { const n = add($(`<div class="bullet">${esc(b)}</div>`), 0.5 + i * 0.12); seg.bl.push({ el: n, start: 0.5 + i * 0.2 }); });
    wp.push({ frac: 0.06, get: () => seg.metricEl, expr: 'amazed' });
    if (seg.bl.length) wp.push({ frac: 0.5, get: () => seg.bl[0].el, expr: 'excited' });
  } else if (seg.type === 'bullet_steps') {
    add($(`<div class="title">${esc(d.title)}</div>`), 0.02);
    seg.st = [];
    const n = d.steps.length;
    d.steps.forEach((s, i) => {
      const e = add($(`<div class="step"><div class="num">${i + 1}</div><div class="txt">${esc(s)}</div></div>`), 0.08 + i * 0.1);
      const start = 0.12 + i * (0.8 / n);
      seg.st.push({ el: e, start, end: start + 0.8 / n });
      wp.push({ frac: start, get: () => e, expr: 'curious' });
    });
  } else if (seg.type === 'cta') {
    const m = add($(`<div class="metric-wrap glass"><div class="metric">${esc(d.highlight_metric)}</div><div class="text">${esc(d.summary)}</div></div>`), 0.05);
    seg.metricEl = m.querySelector('.metric'); seg.metricRaw = d.highlight_metric;
    const b = add($(`<div class="cta-btn">${esc(d.button_text)}</div>`), 0.36);
    wp.push({ frac: 0.05, get: () => seg.metricEl, expr: 'excited' }, { frac: 0.40, get: () => b, expr: 'wink' });
  }
  document.getElementById('stage').appendChild(el);
  return el;
}

function init(tl) {
  T = tl;
  const vStyle = tl.visual_style || 'glass_neon';
  const hLayout = tl.hook_layout || 'left_stack';
  const noMascot = tl.mascot === false ? ' no-mascot' : '';
  document.getElementById('root').className = `theme-${tl.bg_theme} style-${vStyle} hook-${hLayout}${noMascot}`;
  document.getElementById('badge').textContent = tl.badge || '';
  document.getElementById('badge').style.display = tl.badge ? 'block' : 'none';
  document.getElementById('robot').style.display = tl.mascot === false ? 'none' : 'block';
  segEls = T.segments.map((s, i) => build(s, i));
  segEls.forEach(e => e.style.opacity = 1);
  wps = [];
  T.segments.forEach((s) => {
    s.wp.forEach(w => {
      const rs = w.get().getClientRects(); const r = rs[rs.length - 1];
      const tx = r.right - 4, ty = r.top + r.height / 2;
      const x = Math.min(r.right + 18, ROBOT_MAX_X);
      const y = Math.max(ty - 103, 260);
      wps.push({ t: s.start + w.frac * s.dur, x, y, tx, ty, expr: w.expr });
    });
  });
  segEls.forEach(e => e.style.opacity = 0);
  return wps.length;
}

function robotAt(t) {
  const first = wps[0] || { x: 700, y: 500, tx: 650, ty: 550, expr: 'amazed' };
  const last = wps[wps.length - 1] || first;
  // Trong 0.32s cuối cùng của video: Robot bay mượt từ vị trí cuối (CTA) về đúng vị trí đầu tiên (Hook) để khép kín vòng lặp!
  if (T && T.total && t >= T.total - 0.32) {
    const uLoop = easeOut(clamp((t - (T.total - 0.32)) / 0.32));
    const lx = last.x + (first.x - last.x) * uLoop;
    const ly = last.y + (first.y - last.y) * uLoop - 12 * Math.sin(Math.PI * uLoop);
    return { x: lx, y: ly, expr: first.expr, tilt: -6 * Math.sin(Math.PI * uLoop), settled: false, tx: first.tx, ty: first.ty };
  }
  let i = -1;
  for (let k = 0; k < wps.length; k++) if (wps[k].t <= t) i = k;
  if (i < 0) i = 0;
  const cur = wps[i];
  const prev = i > 0 ? wps[i - 1] : first;
  const u = i === 0 ? 1 : easeOut(clamp((t - cur.t) / FLY));
  let x = prev.x + (cur.x - prev.x) * u, y = prev.y + (cur.y - prev.y) * u;
  const flying = u < 1 ? Math.sin(Math.PI * u) : 0;
  const jumpFreq = cur.expr === 'excited' ? 3.2 : 1.3;
  const jumpAmp = cur.expr === 'excited' ? 13 : 7;
  y += jumpAmp * Math.sin(2 * Math.PI * t * jumpFreq) - 14 * flying;
  return { x, y, expr: cur.expr, tilt: -8 * flying, settled: u >= 0.85, tx: cur.tx, ty: cur.ty };
}

function seek(t) {
  document.getElementById('prog').style.width = `${clamp(t / (T.total || 1)) * 100}%`;
  let si = T.segments.findIndex(s => t >= s.start && t < s.start + s.dur);
  if (si < 0) si = T.segments.length - 1;
  document.getElementById('seg-idx').textContent = `${si + 1}/${T.segments.length}`;

  const s = T.segments[si], lt = t - s.start, p = lt / s.dur;
  const loopTail = (T.total && t >= T.total - 0.25) ? clamp((t - (T.total - 0.25)) / 0.25) : 0;
  segEls.forEach((e, i) => {
    if (loopTail > 0 && i === 0) {
      e.style.opacity = easeOut(loopTail);
      e.style.transform = `scale(${1 + 0.12 * (1 - easeOut(loopTail))})`;
      T.segments[0].R.forEach(([n, at]) => { n.style.opacity = at === 0 ? 1 : 0; n.style.transform = 'none'; });
      return;
    }
    if (i !== si) { e.style.opacity = 0; return; }
    if (loopTail > 0 && i === T.segments.length - 1) {
      e.style.opacity = 1 - easeOut(loopTail);
      return;
    }
    const fadeIn = i === 0 ? 1 : lt / 0.16;
    const fadeOut = i === T.segments.length - 1 ? 1 : (s.dur - lt) / 0.15;
    e.style.opacity = clamp(Math.min(fadeIn, fadeOut));
    const hookZoom = (i === 0 && lt < 0.32) ? (1 + 0.12 * (1 - easeOut(lt / 0.32))) : 1;
    e.style.transform = hookZoom !== 1 ? `scale(${hookZoom})` : 'none';
  });
  s.R.forEach(([n, at]) => {
    const rv = easeOut(rise(p, at, 0.09));
    n.style.opacity = rv;
    n.style.transform = `translateY(${(1 - rv) * 24}px) scale(${0.96 + 0.04 * rv})`;
  });
  if (s.metricEl) s.metricEl.textContent = formatCounter(s.metricRaw, (lt - 0.1) / 0.65);
  if (s.typed) {
    const full = s.data.user_prompt, k = clamp((p - 0.12) / 0.38);
    s.typed.textContent = full.slice(0, Math.round(full.length * k));
    s.caret.style.opacity = k < 1 ? 1 : 0;
  }
  if (s.rows) s.rows.forEach(r => r.el.classList.toggle('active', p >= r.start && p < r.end));
  if (s.st) s.st.forEach(r => r.el.classList.toggle('active', p >= r.start && p < r.end));
  if (s.bl) s.bl.forEach(r => r.el.classList.toggle('active', p >= r.start));
  if (s.chk) s.chk.forEach(c => c.el.classList.toggle('done', p >= c.start));
  if (s.rk) s.rk.forEach(k => k.el.classList.toggle('active', k.isTop1 ? p >= k.start : (p >= k.start && p < k.end)));

  // Phụ đề Karaoke + Emoji tự động ở từ đang đọc + Camera Punch-in theo từ khóa
  const sub = document.getElementById('sub');
  const c = (s.subs || []).find(c => lt >= c.s && lt < c.e);
  let kwPunch = 0;
  if (c) {
    const wt = c.wt || c.words.map(w => ({ w, s: c.s, e: c.e }));
    let ai = wt.findIndex(x => lt >= x.s && lt < x.e);
    if (ai < 0) ai = lt < wt[0].s ? 0 : wt.length - 1;
    if (ai === c.kw && wt[ai]) {
      const uKw = clamp((lt - wt[ai].s) / Math.max(0.14, wt[ai].e - wt[ai].s));
      kwPunch = Math.sin(Math.PI * uKw);
    }
    sub.innerHTML = wt.map((x, i) => {
      const st = i === ai ? 'active' : (i < ai ? 'past' : 'future');
      const kw = i === c.kw ? ' kw' : '';
      const em = i === ai ? wordEmoji(x.w) : '';
      return `<span class="w ${st}${kw}">${esc(x.w)}${em}</span>`;
    }).join('');
    sub.style.opacity = 1;
  } else sub.style.opacity = 0;

  document.getElementById('stage').style.transform = kwPunch > 0.01 ? `scale(${(1 + 0.032 * kwPunch).toFixed(4)})` : 'none';
  const flashOp = (si > 0 && lt < 0.15) ? (0.16 * (1 - lt / 0.15)) : 0;
  document.getElementById('flash').style.opacity = flashOp.toFixed(3);

  // Robot + Laser Pointer Beam nối từ đầu ngón tay (x+10, y+103) tới thẻ đang highlight
  const r = robotAt(t);
  const blink = (t % 3.2) > 3.08 && !['wink', 'happy', 'excited'].includes(r.expr);
  setExpr(blink ? 'blink' : r.expr);
  const rb = document.getElementById('robot');
  rb.style.transform = `translate(${r.x}px, ${r.y}px) rotate(${r.tilt}deg)`;
  document.getElementById('jet').setAttribute('ry', 8 + 3 * Math.sin(t * 18));
  document.getElementById('ant').setAttribute('fill', Math.sin(t * (r.expr === 'excited' ? 14 : 6)) > 0 ? '#fde047' : '#38bdf8');

  const laserLine = document.getElementById('laser-line');
  const laserDot = document.getElementById('laser-dot');
  if (T.mascot !== false && r.settled && r.tx < r.x + 8) {
    const hx = r.x + 10, hy = r.y + 103;
    laserLine.setAttribute('x1', hx); laserLine.setAttribute('y1', hy);
    laserLine.setAttribute('x2', r.tx); laserLine.setAttribute('y2', r.ty);
    laserLine.setAttribute('opacity', '0.75');
    laserDot.setAttribute('cx', r.tx); laserDot.setAttribute('cy', r.ty);
    laserDot.setAttribute('opacity', '0.9');
  } else {
    laserLine.setAttribute('opacity', '0');
    laserDot.setAttribute('opacity', '0');
  }
}
</script>
</body>
</html>
