name: Publish Approved Video

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID dòng video trong tab Schedule (để trống sẽ lấy dòng DA_DUYET đầu tiên)"
        required: false
        default: ""

# Chống chạy song song: chỉ cho phép 1 job publish chạy tại một thời điểm, và không xếp hàng quá 1 lượt
concurrency:
  group: publish-video-${{ github.event.inputs.video_id || 'default' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Playwright Chromium browser
        if: startsWith(github.event.inputs.video_id, 'REGEN:')
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          if [[ "${{ github.event.inputs.video_id }}" == REGEN:* ]]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
            pip install -r requirements.txt
            if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
              python -m playwright install --with-deps chromium
            else
              python -m playwright install-deps chromium
            fi
          else
            pip install google-api-python-client google-auth requests
          fi

      - name: Pull video from Drive & publish to YouTube Shorts + Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          DRIVE_MUSIC_FOLDER_ID: ${{ secrets.DRIVE_MUSIC_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            python src/publish.py --video-id "${{ github.event.inputs.video_id }}"
          else
            python src/publish.py
          fi
