name: Keep GitHub Actions Cron Alive (Chống ngủ đông 60 ngày)

on:
  schedule:
    # Chạy định kỳ ngày 1 và 15 hàng tháng lúc 02:00 UTC để giữ toàn bộ Cron workflow luôn active vĩnh viễn
    - cron: "0 2 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh heartbeat timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.heartbeat
          git diff --staged --quiet || (git commit -m "chore: keep-alive heartbeat" && git push)
