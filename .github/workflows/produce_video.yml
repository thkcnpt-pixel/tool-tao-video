name: Produce Short Video (3 ca/ngày)

on:
  schedule:
    # Đặt ở phút :43 (tránh kẹt hàng đợi :00/:30 của GitHub) & trước giờ vàng ~2 tiếng để YouTube xử lý HD + lên lịch chuẩn từng giây:
    # Ca 1 (Sáng 07:00 VN) -> Chạy lúc 04:43 VN (21:43 UTC hôm trước)
    - cron: "43 21 * * *"
    # Ca 2 (Trưa 12:00 VN) -> Chạy lúc 09:43 VN (02:43 UTC)
    - cron: "43 2 * * *"
    # Ca 3 (Tối 20:00 VN)  -> Chạy lúc 17:43 VN (10:43 UTC)
    - cron: "43 10 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Ca phát sóng (SANG / TRUA / TOI - để trống sẽ lấy theo giờ hiện tại)"
        required: false
        default: ""
      seed_topic:
        description: "Thêm nhanh 1 chủ đề CHO_TAO mới trước khi chạy (tùy chọn)"
        required: false
        default: ""
      video_id:
        description: "ID dòng cần tạo lại (dùng cho nút Tạo lại từ Telegram)"
        required: false
        default: ""

concurrency:
  group: produce-video-${{ github.event.inputs.video_id || github.event.inputs.seed_topic || 'cron' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg & Python dependencies (Chromium cài tự động chỉ khi dựng Live)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Produce video & send to Telegram for approval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          DRIVE_MUSIC_FOLDER_ID: ${{ secrets.DRIVE_MUSIC_FOLDER_ID }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIKTOK_CREDENTIALS_JSON: ${{ secrets.TIKTOK_CREDENTIALS_JSON }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
          fi
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            ARGS="$ARGS --video-id \"${{ github.event.inputs.video_id }}\""
          fi
          if [ -n "${{ github.event.inputs.seed_topic }}" ]; then
            ARGS="$ARGS --seed \"${{ github.event.inputs.seed_topic }}\""
          fi
          eval python src/produce.py $ARGS
